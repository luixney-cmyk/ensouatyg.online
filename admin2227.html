<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ENSŌ - Panel de Administración</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;800&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Noto+Serif+JP:wght@300;400;700&display=swap" rel="stylesheet">
    
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --gold: #D4AF37; --gold-light: #F5E17A; --gold-dim: #7A6120;
            --ink: #050505; --parchment: #0D0B08; --red-seal: #8B1A2A; --off-white: #D9D0C0;
        }
        body {
            background-color: var(--ink); color: var(--off-white);
            font-family: 'Cormorant Garamond', serif; min-height: 100vh;
            -webkit-font-smoothing: antialiased; display: flex; flex-direction: column;
        }

        /* ── HEADER ── */
        header {
            background: rgba(13, 11, 8, 0.95); border-bottom: 1px solid rgba(212, 175, 55, 0.2);
            padding: 20px 40px; display: flex; justify-content: space-between; align-items: center;
            position: sticky; top: 0; z-index: 100; box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        .logo { font-family: 'Cinzel', serif; font-size: 1.5rem; letter-spacing: 0.2em; color: var(--gold-light); }
        .logo-sub { font-size: 0.7rem; color: rgba(212,175,55,0.6); letter-spacing: 0.3em; display: block; }
        
        .btn-outline {
            border: 1px solid rgba(212, 175, 55, 0.5); color: rgba(212, 175, 55, 0.9); padding: 10px 24px;
            font-family: 'Cinzel', serif; letter-spacing: 0.15em; text-transform: uppercase; font-size: 0.75rem;
            background: transparent; cursor: pointer; transition: all 0.3s ease; border-radius: 4px;
        }
        .btn-outline:hover { background: rgba(212, 175, 55, 0.1); border-color: var(--gold); color: #fff; }
        .btn-outline:disabled { opacity: 0.5; cursor: not-allowed; }

        /* ── VISTAS ── */
        .view-container { flex: 1; padding: 40px; max-width: 1000px; margin: 0 auto; width: 100%; display: none; }
        .view-container.active { display: block; animation: fadeIn 0.5s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* ── LOGIN ── */
        #view-login { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 80vh; text-align: center; }
        .login-box { background: var(--parchment); border: 1px solid rgba(212,175,55,0.2); padding: 60px 40px; border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); max-width: 400px; width: 100%; }
        .kanji-bg { font-family: 'Noto Serif JP', serif; font-size: 6rem; color: rgba(212,175,55,0.05); position: absolute; z-index: 0; user-select: none; }
        .code-error { color: #8B1A2A; font-family: 'Cormorant Garamond', serif; font-size: 0.95rem; margin-top: 16px; font-style: italic; opacity: 0; transition: opacity 0.3s; }

        /* ── DASHBOARD ── */
        .dash-header { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 24px; flex-wrap: wrap; gap: 16px; }
        .tabs { display: flex; gap: 12px; }
        .admin-tab { padding: 10px 20px; cursor: pointer; border: 1px solid rgba(212,175,55,0.3); color: rgba(212,175,55,0.5); border-radius: 4px; font-family: 'Cinzel', serif; font-size: 0.8rem; transition: all 0.3s; background: transparent; letter-spacing: 0.1em; }
        .admin-tab.active { background: rgba(212,175,55,0.1); color: var(--gold-light); border-color: var(--gold-light); }
        .stats-text { font-family: 'Cormorant Garamond', serif; font-size: 1.1rem; color: rgba(210,200,185,0.8); }
        .stats-text strong { color: var(--gold-light); font-size: 1.4rem; font-family: 'Cinzel', serif; }

        .search-bar { width: 100%; padding: 14px; background: rgba(255,255,255,0.03); border: 1px solid rgba(212,175,55,0.4); color: var(--gold-light); font-family: 'Cinzel', serif; font-size: 1rem; border-radius: 4px; outline: none; margin-bottom: 24px; text-transform: uppercase; letter-spacing: 0.05em; }
        .search-bar:focus { border-color: var(--gold); background: rgba(255,255,255,0.05); }
        
        .data-panel { background: var(--parchment); border: 1px solid rgba(212,175,55,0.15); border-radius: 8px; padding: 24px; min-height: 50vh; }
        
        .admin-guest-card { background: rgba(255,255,255,0.03); border: 1px solid rgba(212,175,55,0.2); border-radius: 4px; padding: 16px 20px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; transition: background 0.3s; }
        .admin-guest-card:hover { background: rgba(255,255,255,0.05); }
        .admin-guest-info { display: flex; flex-direction: column; gap: 4px; }
        .admin-guest-name { font-family: 'Cinzel', serif; font-size: 1.2rem; color: var(--gold-light); font-weight: bold; }
        .admin-guest-host { font-family: 'Cormorant Garamond', serif; font-size: 1rem; font-style: italic; color: rgba(212,175,55,0.6); }
        .admin-guest-actions { display: flex; gap: 12px; align-items: center; }

        .table-header { font-family: 'Cinzel', serif; font-size: 1.2rem; color: var(--gold-light); letter-spacing: 0.15em; margin: 32px 0 16px; padding-bottom: 8px; border-bottom: 1px solid rgba(212,175,55,0.3); display: flex; align-items: center; gap: 12px; }
        .table-header::before { content: ''; width: 4px; height: 20px; background: var(--gold); display: block; }

        .admin-code-row { display: flex; justify-content: space-between; padding: 16px; border-bottom: 1px solid rgba(212,175,55,0.1); align-items: center; }
        .admin-code-val { font-family: 'Cinzel', serif; font-size: 1.2rem; color: var(--gold-light); letter-spacing: 0.15em; font-weight: bold; }
        .admin-code-status.usado { color: #ef4444; font-size: 0.9rem; font-weight: bold; font-family: 'Cormorant Garamond', serif; letter-spacing: 0.05em; }
        .admin-code-status.libre { color: #10b981; font-size: 0.9rem; font-weight: bold; font-family: 'Cormorant Garamond', serif; letter-spacing: 0.05em; }

        /* ── MODALES ALERTAS ── */
        .modal-overlay { position: fixed; inset: 0; background: rgba(8, 8, 8, 0.95); z-index: 200; display: flex; justify-content: center; align-items: center; opacity: 0; pointer-events: none; transition: opacity 0.3s; }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }
        .modal-box { background: var(--parchment); border: 1px solid rgba(212, 175, 55, 0.4); padding: 32px; max-width: 440px; width: 90%; text-align: center; box-shadow: 0 10px 40px rgba(0,0,0,0.9); }
        .prompt-input { width: 100%; padding: 12px; margin: 16px 0 24px; background: transparent; border: none; border-bottom: 2px solid #ef4444; color: #fff; font-family: 'Cinzel', serif; text-align: center; outline: none; }

        /* Scrollbars */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: var(--ink); }
        ::-webkit-scrollbar-thumb { background: rgba(212,175,55,0.3); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(212,175,55,0.6); }
    </style>
</head>
<body>

    <header>
        <div>
            <div class="logo">ENSŌ</div>
            <span class="logo-sub">Panel de Control</span>
        </div>
        <button id="btn-logout" class="btn-outline" style="display: none;" onclick="window.logoutAdmin()">Cerrar Sesión</button>
    </header>

    <!-- VISTA LOGIN -->
    <main id="view-login" class="view-container active">
        <div class="login-box" style="position: relative; overflow: hidden;">
            <span class="kanji-bg" style="top: -20px; right: -20px;">道</span>
            <h2 style="font-family:'Cinzel', serif; color:var(--gold-light); margin-bottom: 24px; letter-spacing: 0.1em; position: relative; z-index: 1;">Acceso Restringido</h2>
            <button class="btn-outline" style="width: 100%; display: flex; align-items: center; justify-content: center; gap: 12px; padding: 14px; position: relative; z-index: 1;" onclick="window.verifyAdminGoogle()">
                <svg width="20" height="20" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M47.532 24.5528C47.532 22.9214 47.3997 21.2811 47.1175 19.6761H24.48V28.5181H37.4434C36.9055 31.3393 35.177 33.8239 32.6461 35.5056V41.4107H40.4001C44.9468 37.229 47.532 31.4239 47.532 24.5528Z" fill="#4285F4"/>
                    <path d="M24.48 48.0016C30.9529 48.0016 36.4116 45.8764 40.4088 41.4107L32.6549 35.5056C30.5038 36.958 27.7552 37.8687 24.48 37.8687C18.132 37.8687 12.756 33.5936 10.8228 27.8385H2.8941V33.993C7.0255 42.195 15.3402 48.0016 24.48 48.0016Z" fill="#34A853"/>
                    <path d="M10.8142 27.8385C9.82424 24.8967 9.82424 21.657 10.8142 18.7153V12.5608H2.88554C-0.961846 20.219 -0.961846 29.3548 2.88554 37.0131L10.8142 27.8385Z" fill="#FBBC05"/>
                    <path d="M24.48 10.1329C27.9158 10.054 31.2389 11.3655 33.6826 13.7235L40.573 6.83315C36.2307 2.76632 30.4357 0.448564 24.48 0.480021C15.3402 0.480021 7.0255 6.28665 2.8941 14.4886L10.8228 20.6432C12.7473 14.8794 18.1233 10.1329 24.48 10.1329Z" fill="#EA4335"/>
                </svg>
                Ingresar con Google
            </button>
            <div id="admin-error" class="code-error"></div>
        </div>
    </main>

    <!-- VISTA DASHBOARD -->
    <main id="view-dashboard" class="view-container">
        <div class="dash-header">
            <div class="tabs">
                <button id="tab-guests" class="admin-tab active" onclick="window.switchAdminTab('guests')">Lista de Confirmados</button>
                <button id="tab-codes" class="admin-tab" onclick="window.switchAdminTab('codes')">Gestión de Códigos</button>
            </div>
            <p class="stats-text">Total Registros: <strong id="admin-total">0</strong></p>
        </div>

        <div class="data-panel">
            <!-- TAB INVITADOS -->
            <div id="panel-guests">
                <input type="text" id="admin-search" class="search-bar" placeholder="Buscar por invitado o anfitrión...">
                <div id="admin-table-body"></div>
            </div>

            <!-- TAB CÓDIGOS -->
            <div id="panel-codes" style="display: none;">
                <div style="display: flex; gap: 16px; margin-bottom: 24px; flex-wrap: wrap;">
                    <button id="btn-generate-codes" class="btn-outline" style="border-color: #4ade80; color: #4ade80;" onclick="window.generateCodesBatch()">+ Generar Códigos Faltantes</button>
                    <button class="btn-outline" style="border-color: #60a5fa; color: #60a5fa;" onclick="window.exportCodesCSV()">↓ Exportar a Excel (CSV)</button>
                    <button class="btn-outline" style="border-color: #ef4444; color: #ef4444; margin-left: auto;" onclick="window.resetDatabase()">⚠️ Resetear Base de Datos</button>
                </div>
                <div id="codes-table-body"></div>
            </div>
        </div>
    </main>

    <!-- MODALES DE CONFIRMACIÓN -->
    <div id="modal-alert" class="modal-overlay">
        <div class="modal-box">
            <p id="alert-msg" style="margin-bottom: 24px; font-size: 1.1rem; line-height: 1.5;"></p>
            <button class="btn-outline" onclick="document.getElementById('modal-alert').classList.remove('active');">Aceptar</button>
        </div>
    </div>

    <div id="modal-confirm" class="modal-overlay">
        <div class="modal-box">
            <p id="confirm-msg" style="margin-bottom: 24px; font-size: 1.1rem; line-height: 1.5;"></p>
            <div style="display:flex; gap:16px; justify-content:center;">
                <button class="btn-outline" style="border-color:#8B1A2A; color:#8B1A2A;" onclick="document.getElementById('modal-confirm').classList.remove('active');">Cancelar</button>
                <button id="confirm-yes-btn" class="btn-outline">Confirmar</button>
            </div>
        </div>
    </div>

    <div id="modal-prompt" class="modal-overlay">
        <div class="modal-box">
            <p id="prompt-msg" style="margin-bottom: 8px; font-size: 1.1rem;"></p>
            <input type="text" id="prompt-input" class="prompt-input" autocomplete="off" placeholder="Escribe aquí...">
            <div style="display:flex; gap:16px; justify-content:center;">
                <button class="btn-outline" style="border-color:#8B1A2A; color:#8B1A2A;" onclick="document.getElementById('modal-prompt').classList.remove('active');">Cancelar</button>
                <button id="prompt-yes-btn" class="btn-outline" style="border-color:#ef4444; color:#ef4444;">Ejecutar Acción</button>
            </div>
        </div>
    </div>

    <!-- SCRIPTS -->
    <script type="module">
        const CONFIG = { totalCapacity: 104, appId: 'enso-uatyg-gala' };
        const ADMIN_EMAIL = "luixnay@gmail.com";

        // BASE DE DATOS (Mantenida segura en el archivo admin)
        const baseDatabase = {

            "GISELLE":    { type: "standard", name: "Giselle Fabiola Jiménez Silva", table: 4, count: 4 },
            "GLORIA":     { type: "standard", name: "Gloria Estefanía Barraza Taracena", table: 3, count: 4 },
            "HEIDI":      { type: "standard", name: "Heidi Gisela Castillo Ramírez", table: 7, count: 4 },
            "IVAN":       { type: "standard", name: "Iván Salinas Rosales", table: 6, count: 4 },
            "JULIETA":    { type: "standard", name: "Julieta Esmeralda Hernández", table: 13, count: 4 },

            "LEONEL":     { type: "standard", name: "Leonel Aldair Arroyo Soria", table: 9, count: 4 },

            "MARTIN":     { type: "standard", name: "Martin Enrique Márquez Abascal", table: 13, count: 4 },
            "NAZBITH":    { type: "standard", name: "Nazbith Adilene Fletes Guardado", table: 12, count: 4 },
            "ZULLY":      { type: "standard", name: "Zully Adolfo Gonzalez Hernández", table: 10, count: 4 }
        };

        function sanitize(str) {
            if (!str) return '';
            return String(str).replace(/[&<>"']/ig, (m) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#x27;' }[m]));
        }

        window.customAlert = (msg) => { document.getElementById('alert-msg').innerText = msg; document.getElementById('modal-alert').classList.add('active'); };
        window.customConfirm = (msg, onYes) => { document.getElementById('confirm-msg').innerText = msg; document.getElementById('confirm-yes-btn').onclick = () => { document.getElementById('modal-confirm').classList.remove('active'); onYes(); }; document.getElementById('modal-confirm').classList.add('active'); };
        window.customPrompt = (msg, onYes) => { document.getElementById('prompt-msg').innerText = msg; const input = document.getElementById('prompt-input'); input.value = ''; document.getElementById('prompt-yes-btn').onclick = () => { document.getElementById('modal-prompt').classList.remove('active'); onYes(input.value); }; document.getElementById('modal-prompt').classList.add('active'); };

        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, GoogleAuthProvider, signInWithPopup, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, doc, onSnapshot, updateDoc, getDocs, writeBatch, runTransaction } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAd_rViRrwdsigVaJNJO82nvVpGzywQT30",
            authDomain: "enso-gala-2026.firebaseapp.com",
            projectId: "enso-gala-2026",
            storageBucket: "enso-gala-2026.firebasestorage.app",
            messagingSenderId: "413676120292",
            appId: "1:413676120292:web:b052eb281e1c32553de4f1"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let allConfirmations = [];
        let allCodes = [];
        let unsubscribeGuests = null;

        onAuthStateChanged(auth, (user) => {
            if (user && user.email === ADMIN_EMAIL) {
                document.getElementById('view-login').classList.remove('active');
                document.getElementById('view-dashboard').classList.add('active');
                document.getElementById('btn-logout').style.display = 'block';

                const colRef = collection(db, 'artifacts', CONFIG.appId, 'public', 'data', 'guests');
                unsubscribeGuests = onSnapshot(colRef, (snapshot) => {
                    allConfirmations = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    if(document.getElementById('panel-guests').style.display !== 'none') window.renderAdminTable();
                });
            } else {
                document.getElementById('view-login').classList.add('active');
                document.getElementById('view-dashboard').classList.remove('active');
                document.getElementById('btn-logout').style.display = 'none';
                if (unsubscribeGuests) { unsubscribeGuests(); unsubscribeGuests = null; }
            }
        });

        window.verifyAdminGoogle = async function() {
            const errDiv = document.getElementById('admin-error'); errDiv.style.opacity = '0';
            try {
                const provider = new GoogleAuthProvider();
                const result = await signInWithPopup(auth, provider);
                if (result.user.email !== ADMIN_EMAIL) {
                    errDiv.innerText = "Acceso denegado: Correo no autorizado."; errDiv.style.opacity = '1';
                    await signOut(auth);
                }
            } catch (error) {
                if (error.code !== 'auth/popup-closed-by-user' && error.code !== 'auth/cancelled-popup-request') {
                    errDiv.innerText = "Error: " + error.message; errDiv.style.opacity = '1';
                }
            }
        };

        window.logoutAdmin = async function() { await signOut(auth); };

        window.switchAdminTab = function(tabName) {
            document.getElementById('tab-guests').classList.remove('active');
            document.getElementById('tab-codes').classList.remove('active');
            document.getElementById('panel-guests').style.display = 'none';
            document.getElementById('panel-codes').style.display = 'none';

            if(tabName === 'guests') {
                document.getElementById('tab-guests').classList.add('active');
                document.getElementById('panel-guests').style.display = 'block';
                window.renderAdminTable();
            } else {
                document.getElementById('tab-codes').classList.add('active');
                document.getElementById('panel-codes').style.display = 'block';
                window.loadAdminCodes(); 
            }
        };

        document.getElementById('admin-search').addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase();
            document.querySelectorAll('.admin-guest-card').forEach(card => {
                const text = card.innerText.toLowerCase();
                card.style.display = text.includes(term) ? 'flex' : 'none';
            });
        });

        window.renderAdminTable = function() {
            const tbody = document.getElementById('admin-table-body'); tbody.innerHTML = ''; 
            document.getElementById('admin-total').innerText = allConfirmations.length;
            
            const sorted = [...allConfirmations].sort((a, b) => {
                const tA = Number(a.table) || a.table, tB = Number(b.table) || b.table;
                if (tA !== tB) { if (typeof tA === 'number' && typeof tB === 'number') return tA - tB; return String(tA).localeCompare(String(tB)); }
                return String(a.guestName).localeCompare(String(b.guestName));
            });

            let currentTable = null;
            sorted.forEach(g => {
                if (g.table !== currentTable) {
                    currentTable = g.table;
                    const header = document.createElement('div'); header.className = 'table-header';
                    header.innerText = `MESA ${sanitize(currentTable)}`; tbody.appendChild(header);
                }

                const div = document.createElement('div'); div.className = 'admin-guest-card';
                div.innerHTML = `
                    <div class="admin-guest-info">
                        <div class="admin-guest-name">${sanitize(g.guestName)}</div>
                        <div class="admin-guest-host">Invitado por: ${sanitize(g.hostName)} [${sanitize(g.hostCode)}]</div>
                    </div>
                    <div class="admin-guest-actions">
                        ${g.asistio ? `<span style="color:#4ade80; font-weight:bold;">✅ Ingresó</span><button class="btn-outline" style="padding: 6px 12px;" onclick="window.toggleCheckIn('${g.id}', false)">Deshacer</button>`
                            : `<span style="color:#9ca3af; font-weight:bold;">⏳ Pendiente</span><button class="btn-outline" style="border-color:#4ade80; color:#4ade80; padding: 6px 12px;" onclick="window.toggleCheckIn('${g.id}', true)">Dar Acceso</button>` }
                        <button class="btn-outline" style="border-color:#8B1A2A; color:#8B1A2A; padding: 6px 12px;" onclick="window.deleteGuest('${g.id}', '${sanitize(g.guestName)}', '${sanitize(g.hostCode)}')">Eliminar</button>
                    </div>`;
                tbody.appendChild(div);
            });
            if(sorted.length === 0) tbody.innerHTML = '<p style="text-align:center; padding: 40px; color: rgba(255,255,255,0.4);">Aún no hay invitados confirmados.</p>';
        };

        window.toggleCheckIn = async (docId, status) => { try { await updateDoc(doc(db, 'artifacts', CONFIG.appId, 'public', 'data', 'guests', docId), { asistio: status }); } catch(e){} };

        window.deleteGuest = async function(docId, guestName, hostCode) {
            window.customConfirm(`¿Eliminar a ${guestName}? Su código (${hostCode}) volverá a estar disponible.`, async () => {
                try {
                    await runTransaction(db, async (transaction) => {
                        const guestRef = doc(db, 'artifacts', CONFIG.appId, 'public', 'data', 'guests', docId);
                        const inviteRef = doc(db, 'artifacts', CONFIG.appId, 'public', 'data', 'invites', hostCode);
                        const statsRef = doc(db, 'artifacts', CONFIG.appId, 'public', 'data', 'stats', 'main');
                        transaction.delete(guestRef);
                        transaction.set(inviteRef, { usado: false, guestName: "" }, { merge: true });
                        const statsDoc = await transaction.get(statsRef);
                        let newCount = statsDoc.exists() && statsDoc.data().confirmedCount > 0 ? statsDoc.data().confirmedCount - 1 : 0;
                        transaction.set(statsRef, { confirmedCount: newCount }, { merge: true });
                    });
                } catch(e) { window.customAlert("Error al borrar: " + e.message); }
            });
        };

        // ── GENERADOR DE CÓDIGOS ──
        window.generateCodesBatch = async function() {
            const btn = document.getElementById('btn-generate-codes'); if (btn.disabled) return;
            window.customConfirm("¿Generar los códigos faltantes para completar la cuota de cada alumno/VIP?", async () => {
                btn.innerText = "Generando..."; btn.disabled = true;
                try {
                    const invitesRef = collection(db, 'artifacts', CONFIG.appId, 'public', 'data', 'invites');
                    const existingSnap = await getDocs(invitesRef);
                    const existing = new Set(); const countByHost = {};
                    existingSnap.forEach(d => { existing.add(d.id); countByHost[d.data().hostName] = (countByHost[d.data().hostName] || 0) + 1; });

                    const batch = writeBatch(db); let added = 0;
                    for (const [basePrefix, data] of Object.entries(baseDatabase)) {
                        const codesNeeded = data.count - (countByHost[data.name] || 0);
                        for(let i=0; i<codesNeeded; i++) {
                            let newCode; let attempts = 0;
                            do { newCode = basePrefix + Math.floor(1000 + Math.random() * 9000); attempts++; } while(existing.has(newCode) && attempts < 100);
                            existing.add(newCode);
                            batch.set(doc(invitesRef, newCode), { codigo: newCode, type: data.type, hostCode: basePrefix, hostName: data.name, table: data.table, usado: false, guestName: "" });
                            added++;
                        }
                    }
                    if(added > 0) { await batch.commit(); window.customAlert(`✅ Se generaron ${added} códigos nuevos.`); } 
                    else { window.customAlert("ℹ️ La base de datos ya está completa. No se crearon códigos."); }
                    window.loadAdminCodes();
                } catch(e) { window.customAlert("Error. Revisa consola."); btn.innerText = "+ Generar Códigos Faltantes"; btn.disabled = false; } 
            });
        };

        window.loadAdminCodes = async function() {
            const tbody = document.getElementById('codes-table-body');
            tbody.innerHTML = '<p style="text-align: center; padding:40px;">Cargando base de datos...</p>';
            try {
                const qSnap = await getDocs(collection(db, 'artifacts', CONFIG.appId, 'public', 'data', 'invites'));
                allCodes = []; qSnap.forEach(d => allCodes.push(d.data()));
                allCodes.sort((a,b) => a.codigo.localeCompare(b.codigo));
                
                let html = '';
                allCodes.forEach(c => {
                    const status = c.usado ? `<span class="admin-code-status usado">❌ Usado (${sanitize(c.guestName)})</span>` : `<span class="admin-code-status libre">✅ Libre</span>`;
                    html += `<div class="admin-code-row"><div class="admin-code-val">${c.codigo} <span style="font-size:0.8rem; color:var(--gold-dim);">[Mesa ${c.table}]</span></div><div>${status}</div></div>`;
                });
                tbody.innerHTML = html || '<p style="text-align:center; padding: 40px;">No hay códigos generados.</p>';
                document.getElementById('admin-total').innerText = allCodes.length;

                const btnGen = document.getElementById('btn-generate-codes');
                if (allCodes.length >= CONFIG.totalCapacity) {
                    btnGen.disabled = true; btnGen.innerText = `✓ Códigos Listos (${allCodes.length})`;
                } else {
                    btnGen.disabled = false; btnGen.innerText = "+ Generar Códigos Faltantes";
                }
            } catch(e) { tbody.innerHTML = '<p style="color:red; text-align:center;">Error al cargar datos.</p>'; }
        };

        window.exportCodesCSV = function() {
            if(allCodes.length === 0) return window.customAlert("No hay códigos para exportar.");
            let csvContent = "data:text/csv;charset=utf-8,Codigo,Anfitrion,Mesa,Tipo,Estado,InvitadoRegistrado\n";
            allCodes.forEach(c => {
                csvContent += [ c.codigo, c.hostName, c.table, c.type, c.usado ? "Usado" : "Libre", c.guestName || "" ].map(item => `"${String(item).replace(/"/g, '""')}"`).join(",") + "\r\n";
            });
            const link = document.createElement("a");
            link.href = encodeURI(csvContent); link.download = `Codigos_ENSO.csv`;
            document.body.appendChild(link); link.click(); document.body.removeChild(link);
        };

        window.resetDatabase = async function() {
            window.customPrompt("⚠️ PELIGRO: Borrará TODO (invitados y códigos).\nEscribe 'RESET ENSO' para confirmar:", async (text) => {
                if (text === "RESET ENSO") {
                    try {
                        const batch = writeBatch(db);
                        const guests = await getDocs(collection(db, 'artifacts', CONFIG.appId, 'public', 'data', 'guests'));
                        guests.forEach(d => batch.delete(d.ref));
                        const invites = await getDocs(collection(db, 'artifacts', CONFIG.appId, 'public', 'data', 'invites'));
                        invites.forEach(d => batch.delete(d.ref));
                        batch.set(doc(db, 'artifacts', CONFIG.appId, 'public', 'data', 'stats', 'main'), { confirmedCount: 0, totalCapacity: CONFIG.totalCapacity });
                        await batch.commit();
                        window.customAlert("✅ Base de datos reseteada al 100%.");
                        if (document.getElementById('panel-codes').style.display === 'block') window.loadAdminCodes();
                    } catch(e) { window.customAlert("Error: " + e.message); }
                } else { window.customAlert("Texto incorrecto. Operación cancelada."); }
            });
        };
    </script>
</body>
</html>
